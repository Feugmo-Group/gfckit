[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gfckit"
version = "0.1.0"
description = "General-fractional-calculus toolkit for data-driven identification of degradation memory kernels (batteries, corrosion)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["jax>=0.4"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Feugmo-Group/gfckit"
Issues = "https://github.com/Feugmo-Group/gfckit/issues"

[tool.setuptools.packages.find]
where = ["src"]
